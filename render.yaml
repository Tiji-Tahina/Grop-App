# render.yaml — Infrastructure as Code for Render
# Doc: https://render.com/docs/blueprint-spec
#
# Service definition:
#   grop-app-backend-staging   Docker Web Service — single demo environment
#
# Database:
#   grop-app-db-staging        PostgreSQL free tier
#
# The frontend (React/Vite) is deployed on Netlify via netlify.toml.
#
# ⚠️  sync: false values mean envVars are not
#      overwritten on each deployment — edit them in the Render dashboard.

databases:
  - name: grop-app-db-staging
    databaseName: cropgpt_staging
    user: cropgpt
    plan: free

services:
  - type: web
    name: grop-app-backend-staging
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grop-app-db-staging
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # ex : https://cropmg.netlify.app
      - key: COLAB_LLM_URL
        sync: false   # ngrok URL — changes on each Colab restart
      # ── ClickHouse Cloud (OLAP data warehouse) ─────────────────────────
      # Consumed by OLAPEngine for /api/predictions/analytics/
      # AND by data_werehouse.ch_facts to enrich the chat with
      # factual figures (yield, production, price per region/year).
      - key: CH_HOST
        sync: false   # ex : j78t3xodco.eu-central-1.aws.clickhouse.cloud
      - key: CH_PORT
        value: "8443"
      - key: CH_USER
        value: default
      - key: CH_PASSWORD
        sync: false
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: staging
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WEB_CONCURRENCY
        value: "1"
