# render.yaml — Infrastructure as Code pour Render
# Doc : https://render.com/docs/blueprint-spec
#
# Service défini :
#   grop-app-backend-staging   Web Service Docker — environnement de démo unique
#
# Base de données :
#   grop-app-db-staging        PostgreSQL free tier
#
# Le frontend (React/Vite) est déployé sur Netlify via netlify.toml.
#
# ⚠️  Les valeurs sync: false signifient que les envVars ne sont pas
#      écrasées à chaque déploiement — les modifier dans le dashboard Render.

databases:
  - name: grop-app-db-staging
    databaseName: cropgpt_staging
    user: cropgpt
    plan: free

services:
  - type: web
    name: grop-app-backend-staging
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grop-app-db-staging
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # ex : https://cropmg.netlify.app
      - key: COLAB_LLM_URL
        sync: false   # ngrok URL — change à chaque relance Colab
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: staging
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WEB_CONCURRENCY
        value: "1"
