name: CD

# Validation build on every push to main.
# Actual deployment is managed by Render (auto-deploy GitHub via Blueprint)
# and Netlify (auto-deploy GitHub via connected site).

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── 1. Build Docker backend ──────────────────────────────────────────────
  build-backend:
    name: Build — Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Render rebuilds the image itself from the repo via webhook → no need
      # to push to a registry. We just validate that the Dockerfile builds correctly.
      - name: Build backend image (validate Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: grop-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Build frontend ────────────────────────────────────────────────────
  build-frontend:
    name: Build — Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --legacy-peer-deps: react-simple-maps@3 declares peer react ≤ 18,
      # the project uses react@19. Same flag as netlify.toml (consistent).
      - name: Install & Build
        run: npm ci --legacy-peer-deps && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1
