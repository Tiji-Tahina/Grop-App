[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py
testpaths = .
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    colab: tests requiring active COLAB_LLM_URL (skipped if absent)
    slow: slow tests — benchmarks or real LLM inference
    smoke: smoke tests against a deployed staging environment
